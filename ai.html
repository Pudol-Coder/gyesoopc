<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 질문 | 햄스터와 로봇 축구</title>
<meta name="description" content="햄스터와 로봇 축구 행사 안내 사이트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav class="nav" aria-label="주요 메뉴">
  <a class="brand" href="/main">🐹 햄스터와 로봇 축구 ⚽🤖</a>
  <a class="tab" href="/main" >메인</a>
  <a class="tab" href="/ai" aria-current="page">AI 질문</a>
  <a class="tab" href="/information" >행사 안내</a>
  <a class="tab" href="/etc" >기타</a>
</nav>
<main class="wrap">
  <section>
    <h1>AI에게 물어보기</h1>
    <p class="lead">뭐야 님 어케 이 페이지 들어왔어요 이거 버려졌는데 애초에 작동을 안해서 버렸어요 ㅎㅎ... 며칠 뒤가 계수젠데 언제 고쳐요 넵 그랬습니다</p>

    <div class="chips" id="chips">
      <button type="button">어떤 행사인가요?</button>
      <button type="button">준비물이 뭐예요?</button>
      <button type="button">로봇 축구는 어떻게 하나요?</button>
    </div>

    <div class="chat" id="chat" role="log" aria-live="polite">
      <div class="bubble bot">멍청한 개발자 자식, 나는 고쳐주고 가야지</div>
    </div>

    <form class="ask" id="askForm">
      <label for="q" style="position:absolute;left:-9999px">질문 입력</label>
      <input type="text" id="q" placeholder="질문을 입력하세요" maxlength="300" autocomplete="off" required>
      <button class="btn" type="submit" id="abtn">보내기</button>
    </form>
  </section>
</main>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('askForm');
const input = document.getElementById('q');
const btn = document.getElementById('abtn');
const history = [];

function add(role, text){
  const d = document.createElement('div');
  d.className = 'bubble ' + (role === 'user' ? 'user' : 'bot');
  d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}

async function ask(text){
  add('user', text);
  const wait = add('bot', '생각 중…');
  btn.disabled = true;
  try{
    const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,history:history.slice(-6)})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'AI 응답에 실패했어요.');
    wait.textContent = d.reply;
    history.push({role:'user',text},{role:'model',text:d.reply});
  }catch(err){
    wait.textContent = err.message + ' 잠시 뒤 다시 질문해 주세요.';
  }finally{ btn.disabled = false; input.focus(); }
}

form.addEventListener('submit', e=>{
  e.preventDefault();
  const t = input.value.trim(); if(!t) return;
  input.value=''; ask(t);
});
document.querySelectorAll('#chips button').forEach(b=>b.addEventListener('click',()=>ask(b.textContent)));
</script>
<footer><div class="wrap">© 햄스터와 로봇 축구 · gyesoopc.kro.kr</div></footer>
</body>
</html>
